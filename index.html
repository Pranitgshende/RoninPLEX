    <script>
      self.global = self;
      if (typeof self.Buffer === 'undefined') {
        self.Buffer = class Buffer extends Uint8Array {
          static from(data, enc) {
            if (typeof data === 'string') {
              if (enc === 'base64') {
                const bin = typeof atob !== 'undefined' ? atob(data) : '';
                const b = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
                return b;
              }
              return new TextEncoder().encode(data);
            }
            if (Array.isArray(data) || data instanceof Uint8Array) {
              return new Uint8Array(data);
            }
            return new Uint8Array(0);
          }
          static isBuffer(o) { return o instanceof Uint8Array; }
          static alloc(s) { return new Uint8Array(s); }
        };
      }
    </script>
