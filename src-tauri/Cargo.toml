[package]
name = "roninplex"
version = "2.0.1"
description = "Personal movie and TV discovery & streaming application"
authors = ["RoninPLEX Team"]
edition = "2021"

[lib]
name = "roninplex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
